<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RentCars: аренда премиальных авто напрямую у владельцев</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#0b0c10;--card:#14161c;--c2:#1b1e27;--ln:#272b36;--tx:#f1ede4;--mu:#8d93a3;--g:#d8b56a;--g2:#f0d9a0;--ok:#6ee7a8;--bad:#ff8a80;--wt:#f2c36b}
body{font:16px/1.6 Manrope,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
h1,h2,h3,.logo,.plate,.pl2,.tot b,.ttl{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-variant-numeric:lining-nums}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{color-scheme:dark}
:focus-visible{outline:2px solid var(--g);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
nav{position:sticky;top:0;z-index:30;background:rgba(11,12,16,.78);backdrop-filter:blur(16px);border-bottom:1px solid var(--ln)}
.nv{display:flex;align-items:center;gap:26px;height:68px;overflow-x:auto}
.logo{font-size:30px;display:flex;align-items:center;gap:12px;cursor:pointer;flex:none}
.logo i{width:12px;height:12px;background:var(--g);transform:rotate(45deg)}
.lk{background:none;border:0;color:var(--mu);cursor:pointer;padding:8px 0;font-weight:600;white-space:nowrap}
.lk:hover,.lk.on{color:var(--tx)}.lk.on{box-shadow:0 1px var(--g)}
.sp{flex:1}.mu{color:var(--mu);font-size:14px}
.cn{display:flex;gap:8px;align-items:center}
.btn{background:var(--g);color:#16120a;border:0;border-radius:999px;padding:11px 22px;font-weight:700;cursor:pointer;transition:filter .15s,transform .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.g{background:none;border:1px solid var(--ln);color:var(--tx)}.btn.g:hover{border-color:var(--g)}
.btn.d{background:var(--c2);color:var(--tx);border:1px solid var(--ln)}
.btn.r{background:none;color:var(--bad);border:1px solid #5a2a2a}
.btn.s{padding:7px 15px;font-size:14px}.btn.f{width:100%;margin-top:16px}
.hero{padding:64px 0 80px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;left:46%;top:-220px;width:900px;height:720px;background:radial-gradient(closest-side,rgba(216,181,106,.15),transparent);pointer-events:none}
.hg{display:grid;grid-template-columns:1fr 1.05fr;gap:56px;align-items:center;position:relative}
.hg>*{animation:rise .9s both}.hg>*+*{animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(26px)}}
.hero h1{font-size:clamp(46px,6.4vw,86px);line-height:.98;letter-spacing:-.02em}
.hero p{color:var(--mu);font-size:18px;margin:22px 0 0;max-width:460px}
.tk{background:rgba(255,255,255,.04);border:1px solid var(--ln);backdrop-filter:blur(14px);border-radius:24px;padding:22px;margin-top:34px;max-width:480px}
.tk h3{font-size:26px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fs,.gal{position:relative;border-radius:32px;overflow:hidden;border:1px solid var(--ln);background:radial-gradient(70% 60% at 50% 42%,#2b2d38,#0d0e13)}
.fs{aspect-ratio:5/4}.gal{aspect-ratio:16/10}
#fv,#gv{position:absolute;inset:0}#fv canvas,#gv canvas{display:block;width:100%;height:100%;cursor:grab}#fv img,#gv img{width:100%;height:100%;object-fit:cover;display:block}
.fc{position:absolute;left:18px;right:18px;bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:rgba(11,12,16,.66);backdrop-filter:blur(12px);border:1px solid #ffffff1c;border-radius:20px;padding:12px 16px;pointer-events:none}
.fc .btn{pointer-events:auto}.fc h3{font-size:26px;line-height:1.1}
.sec{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin:40px 0 20px}.sec h2{font-size:44px;letter-spacing:-.01em}
input,select,textarea{background:var(--c2);border:1px solid var(--ln);border-radius:12px;padding:11px 14px;width:100%}
textarea{min-height:84px;resize:vertical}
label{display:block;font-weight:600;font-size:13px;color:var(--mu);margin:14px 0 6px}
.fl{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}.fl>*{flex:1;min-width:150px;width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:26px;padding-bottom:90px}
.car{background:var(--card);border:1px solid var(--ln);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:border-color .2s,transform .2s}
.car:hover{border-color:var(--g);transform:translateY(-4px)}
.pic{height:230px;position:relative;overflow:hidden;display:grid;place-items:center;color:hsl(var(--h) 55% 62%);background:linear-gradient(160deg,hsl(var(--h) 30% 24%),hsl(var(--h) 25% 11%))}
.pic svg{width:70%}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}.car:hover .pic img{transform:scale(1.05)}
.tag{position:absolute;right:14px;top:14px;background:var(--g);color:#16120a;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700;z-index:2}
.plate{position:absolute;left:14px;bottom:14px;background:rgba(11,12,16,.7);backdrop-filter:blur(8px);border:1px solid #ffffff26;border-radius:999px;padding:4px 16px;font-size:24px;color:var(--g2);z-index:2}
.plate small{font:600 12px Manrope;color:var(--mu)}
.cb{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1}.cb h3{font-size:27px;line-height:1.1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--ln);border-radius:8px;padding:2px 10px;font-size:13px;color:var(--mu);font-weight:600}
.chip.me{background:var(--g);border-color:var(--g);color:#16120a}
.cf{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:8px;flex-wrap:wrap}
.badge{display:inline-block;border-radius:8px;padding:2px 10px;font-size:13px;font-weight:700;border:1px solid currentColor}
.available,.confirmed,.completed{color:var(--ok)}.pending,.maintenance{color:var(--wt)}.cancelled{color:var(--bad)}
.sk{height:340px;border-radius:24px;background:var(--card)}
.ttl{font-size:44px}.ph{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin:48px 0 26px}
.back{background:none;border:0;cursor:pointer;font-weight:700;color:var(--mu);margin-top:28px;padding:4px 0}.back:hover{color:var(--g)}
.dtl{display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:start;margin:14px 0 60px}
.ld{position:absolute;inset:0;display:grid;place-items:center;color:var(--mu);font-weight:600;pointer-events:none;text-align:center;padding:20px}
.gt{position:absolute;left:14px;top:14px;display:flex;gap:6px;z-index:3}
.gt button,.vb button{background:rgba(11,12,16,.7);backdrop-filter:blur(8px);color:var(--tx);border:1px solid #ffffff26;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer}
.gt button.on,.vb button.on,.vb button:hover{background:var(--g);color:#16120a;border-color:var(--g)}
.vb{position:absolute;left:14px;right:14px;bottom:14px;display:flex;gap:6px;flex-wrap:wrap;justify-content:space-between}
.vb div{display:flex;gap:6px;flex-wrap:wrap}
.panel{background:var(--card);border:1px solid var(--ln);border-radius:28px;padding:28px;position:sticky;top:90px}
.panel h1{font-size:40px;line-height:1.05;margin-top:12px}
.pl2{font-size:44px;color:var(--g2);margin:14px 0 2px;line-height:1}.pl2 small{font:600 13px Manrope;color:var(--mu)}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.sc{border:1px solid var(--ln);border-radius:14px;padding:8px 12px}.sc small{display:block;color:var(--mu);font-size:12px;font-weight:600}
.own{display:flex;align-items:center;gap:10px}
.own i{width:40px;height:40px;border-radius:50%;background:var(--g);color:#16120a;display:grid;place-items:center;font:700 22px 'Cormorant Garamond',serif;font-style:normal}
.box2{margin-top:26px;background:var(--card);border:1px solid var(--ln);border-radius:24px;padding:26px}.box2 h3{font-size:28px;margin-bottom:12px}
.cals{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:24px}
.mo h4{font:600 20px 'Cormorant Garamond',serif;text-transform:capitalize;margin-bottom:8px}
.wd,.dg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.wd span{text-align:center;font-size:12px;color:var(--mu);font-weight:700}
.dg b{font-weight:600;text-align:center;padding:7px 0;border-radius:8px;font-size:14px;background:#12281d;color:var(--ok)}
.dg b.bz{background:#341b1b;color:var(--bad);text-decoration:line-through}.dg b.pa{background:none;color:#4a4f5c}
.bk{background:var(--card);border:1px solid var(--ln);border-left:4px solid var(--ln);border-radius:18px;padding:16px 22px;display:flex;flex-wrap:wrap;align-items:center;gap:14px 26px;margin-bottom:12px}
.bk.pending{border-left-color:var(--wt)}.bk.confirmed,.bk.completed{border-left-color:var(--ok)}.bk.cancelled{border-left-color:var(--bad)}
.bk .g{flex:1;min-width:190px}.bk h3{font-size:24px}.bk b{font-size:18px}
.ci{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:16px 22px;margin-bottom:10px;cursor:pointer;transition:border-color .2s}
.ci:hover{border-color:var(--g)}.ci h3{font-size:24px}
.empty{padding:50px 0;text-align:center;color:var(--mu);grid-column:1/-1}.empty .btn{margin:14px 4px 0}
.ov{position:fixed;inset:0;background:rgba(5,6,8,.78);backdrop-filter:blur(6px);display:none;place-items:center;z-index:50;padding:16px}.ov.on{display:grid}
.box{background:var(--card);border:1px solid var(--ln);border-radius:28px;padding:30px;width:min(500px,100%);max-height:92vh;overflow:auto;animation:pop .2s ease-out}
@keyframes pop{from{transform:translateY(14px);opacity:0}}
.box h2{font-size:32px;line-height:1.1}.box a{color:var(--g);font-weight:700}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs button{flex:1;padding:10px;border:1px solid var(--ln);background:none;border-radius:999px;font-weight:700;cursor:pointer;color:var(--mu)}
.tabs button.on{background:var(--g);color:#16120a;border-color:var(--g)}
.tot{margin-top:14px;padding:14px;border:1px dashed var(--ln);border-radius:14px;text-align:center}.tot b{display:block;font-size:34px;color:var(--g2);line-height:1.2}
.msgs{height:320px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin:14px 0;padding:12px;background:var(--bg);border-radius:16px}
.b{max-width:80%;background:var(--c2);border:1px solid var(--ln);border-radius:16px 16px 16px 4px;padding:7px 13px;overflow-wrap:anywhere}
.b.me{align-self:flex-end;background:var(--g);border-color:var(--g);color:#16120a;border-radius:16px 16px 4px 16px}
.b small{display:block;font-size:11px;opacity:.7;font-weight:600}.send{display:flex;gap:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--c2);color:var(--tx);padding:12px 22px;border-radius:999px;z-index:99;display:none;max-width:90vw;white-space:pre-line;border:1px solid var(--g)}
footer{border-top:1px solid var(--ln);color:var(--mu);padding:34px 0;font-size:14px}
@media(max-width:900px){.hg,.dtl{grid-template-columns:1fr}.hid{display:none}.panel{position:static}.hero{padding:40px 0 60px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="car" viewBox="0 0 200 80"><path d="M8 58V47q0-6 8-8l34-7 17-18q3-4 9-4h54q6 0 10 4l17 18 26 6q8 2 8 8v11z" fill="currentColor"/><path d="M72 32l11-14h28v14zM118 32V18h14l14 14z" fill="#fff" opacity=".8"/><circle cx="48" cy="60" r="13" fill="#0b0c10"/><circle cx="152" cy="60" r="13" fill="#0b0c10"/><circle cx="48" cy="60" r="5" fill="#cfd3dc"/><circle cx="152" cy="60" r="5" fill="#cfd3dc"/></symbol></svg>
<nav><div class="wrap nv">
<div class="logo" onclick="showCars()"><i></i><span class="hid">RentCars</span></div>
<button class="lk" id="l1" onclick="showCars()">Машины</button>
<button class="lk" id="l2" onclick="showMine()">Мои машины</button>
<button class="lk" id="l3" onclick="showBookings()">Мои брони</button>
<button class="lk" id="l4" onclick="showChats()">Чаты</button>
<div class="sp"></div><div id="au" class="cn"></div>
</div></nav>
<div id="app"></div>
<footer><div class="wrap">RentCars. Аренда авто напрямую у владельцев: цена, ключи и условия без посредников.</div></footer>
<div class="ov" id="ov" onclick="if(event.target===this)closeM()"><div class="box" id="bx"></div></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>Number(n).toLocaleString('ru-RU');
const ST={pending:'Ожидает',confirmed:'Подтверждена',cancelled:'Отменена',completed:'Завершена',available:'Свободна',maintenance:'На обслуживании'};
const GB={automatic:'Автомат',manual:'Механика'},FL={petrol:'Бензин',diesel:'Дизель',electric:'Электро',gas:'Газ'};
let token=localStorage.getItem('t'),cars=[],busy=[],cmo=0,ct,tm,dbt,pend,stop3d;
const today=()=>new Date().toISOString().slice(0,10);
const hue=s=>{let h=0;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))%360;return h};
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(tm);tm=setTimeout(()=>e.style.display='none',3800)};
const err=e=>!e?'Ошибка':typeof e==='string'?e:e.detail?e.detail:Object.entries(e).map(([k,v])=>(k==='non_field_errors'?'':k+': ')+[].concat(v).join(' ')).join('\n');
const uid=()=>{try{return String(JSON.parse(atob(token.split('.')[1])).user_id)}catch(e){return null}};

async function refresh(){
  const r=localStorage.getItem('r');if(!r)return false;
  const x=await fetch('/token/refresh/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh:r})});
  if(!x.ok)return false;token=(await x.json()).access;localStorage.setItem('t',token);return true;
}
async function api(path,opt,retry){
  opt=opt||{};const isF=opt.body instanceof FormData,h={};
  if(!isF)h['Content-Type']='application/json';
  if(token)h.Authorization='Bearer '+token;
  const r=await fetch(path,{method:opt.method||'GET',headers:h,body:opt.body?(isF?opt.body:JSON.stringify(opt.body)):undefined});
  let d=null;try{d=await r.json()}catch(e){}
  if(r.status===401&&token&&!retry){
    if(await refresh())return api(path,opt,true);
    logout(true);throw{detail:'Сессия закончилась. Войди снова.'};
  }
  if(!r.ok)throw d||{detail:'Ошибка сервера'};
  return d;
}
function renderNav(){$('#au').innerHTML=token?`<button class="btn s" onclick="carM()">+ Добавить машину</button><span class="mu hid">${esc(localStorage.getItem('u'))}</span><button class="btn g s" onclick="logout()">Выйти</button>`:'<button class="btn s" onclick="authM()">Войти</button>'}
const setTab=n=>[1,2,3,4].forEach(i=>$('#l'+i).classList.toggle('on',i===n));
function off3d(){if(stop3d){stop3d();stop3d=null}}
function logout(silent){token=null;['t','r','u'].forEach(k=>localStorage.removeItem(k));renderNav();showCars();if(!silent)toast('Ты вышел из аккаунта')}
const openM=()=>$('#ov').classList.add('on');
function closeM(){$('#ov').classList.remove('on');clearInterval(ct)}
addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
const need=m=>{if(token)return true;toast(m);authM();return false};

/* Каталог */
function showCars(){
  off3d();setTab(1);scrollTo(0,0);const t=today();
  $('#app').innerHTML=`<section class="hero"><div class="wrap hg"><div><h1>Лучшие машины. Ключи от владельцев.</h1><p>Выбери даты, найди свободный автомобиль, рассмотри его в 3D и договорись с владельцем в чате.</p>
<div class="tk"><h3>Когда нужна машина?</h3><div class="two"><div><label>С какого дня</label><input id="hs" type="date" min="${t}"></div><div><label>По какой день</label><input id="he" type="date" min="${t}"></div></div><button class="btn f" onclick="findFree()">Найти свободные машины</button></div></div>
<div class="fs"><div id="fv"></div><div class="fc" id="fc"></div></div></div></section>
<div class="wrap"><div class="sec" id="cat"><h2>Машины</h2><span class="mu" id="info"></span></div>
<div class="fl"><input id="q" placeholder="Марка или модель" oninput="deb()"><input id="mp" type="number" min="0" placeholder="Цена за сутки до" oninput="deb()"><select id="o" onchange="loadCars()"><option value="">Без сортировки</option><option value="price_per_day">Сначала дешевле</option><option value="-price_per_day">Сначала дороже</option><option value="-year">Сначала новее</option></select><button class="btn g" onclick="resetF()">Сбросить</button></div>
<div class="grid" id="grid">${'<div class="sk"></div>'.repeat(3)}</div></div>`;
  loadCars().then(feat);
}
function feat(){
  const s=$('#fv');if(!s)return;
  const c=cars.find(x=>x.model_3d)||cars.find(x=>x.image)||cars[0];
  if(!c){s.innerHTML='<div class="ld">Добавь первую машину, и она появится здесь</div>';return}
  $('#fc').innerHTML=`<div><h3>${esc(c.brand)} ${esc(c.model)}</h3><span class="mu">${fmt(c.price_per_day)} в сутки</span></div><button class="btn s" onclick="showCar(${c.id})">Смотреть</button>`;
  if(c.model_3d){const go=()=>{if($('#fv')===s)stop3d=mount3D(s,c.model_3d,1)};window.mount3D?go():addEventListener('m3d',go,{once:true})}
  else if(c.image)s.innerHTML=`<img src="${esc(c.image)}" alt="">`;
}
const deb=()=>{clearTimeout(dbt);dbt=setTimeout(loadCars,300)};
function findFree(){const a=$('#hs').value,b=$('#he').value;if(!a||!b)return toast('Выбери обе даты');if(b<=a)return toast('Дата окончания должна быть позже начала');loadCars();$('#cat').scrollIntoView({behavior:'smooth'})}
function resetF(){['q','mp','o','hs','he'].forEach(i=>$('#'+i).value='');loadCars()}
async function loadCars(){
  const p=new URLSearchParams(),a=$('#hs').value,b=$('#he').value,dated=a&&b&&b>a;
  if($('#q').value)p.set('search',$('#q').value);if($('#mp').value)p.set('max_price',$('#mp').value);if($('#o').value)p.set('ordering',$('#o').value);
  if(dated){p.set('start',a);p.set('end',b)}
  try{const d=await api('/cars/?'+p);cars=d.results||d;
    $('#info').textContent=(dated?`Свободно с ${a} по ${b}: `:'Всего: ')+cars.length;
    $('#grid').innerHTML=cars.length?cars.map(carCard).join(''):'<div class="empty">Машин не найдено. Измени даты, поиск или цену.<br><button class="btn" onclick="carM()">+ Добавить машину</button><button class="btn g" onclick="resetF()">Сбросить фильтры</button></div>';
  }catch(e){toast(err(e))}
}
function carCard(c){
  const mine=token&&String(c.owner)===uid();
  const chips=[c.transmission&&(GB[c.transmission]||c.transmission),c.seats&&c.seats+' мест',c.rating&&'★ '+c.rating].filter(Boolean).map(x=>`<span class="chip">${esc(x)}</span>`).join('');
  const act=mine?`<div class="cn"><button class="btn g s" onclick="carM(${c.id})">Изменить</button><button class="btn r s" onclick="delCar(${c.id})">Удалить</button></div>`:c.status==='available'?`<button class="btn s" onclick="showCar(${c.id})">Забронировать</button>`:'';
  return `<article class="car" onclick="showCar(${c.id})"><div class="pic" style="--h:${hue(c.brand+c.model)}">${c.model_3d?'<span class="tag">3D</span>':''}${c.image?`<img src="${esc(c.image)}" alt="">`:'<svg viewBox="0 0 200 80"><use href="#car"/></svg>'}<div class="plate">${fmt(c.price_per_day)} <small>в сутки</small></div></div>
<div class="cb"><h3>${esc(c.brand)} ${esc(c.model)}</h3><div class="chips"><span class="chip">${esc(c.year)} г.</span>${chips}${mine?'<span class="chip me">Ваша машина</span>':''}</div>
<div class="cf" onclick="event.stopPropagation()"><span class="badge ${esc(c.status)}">${ST[c.status]||esc(c.status)}</span>${act}</div></div></article>`;
}

/* Страница машины */
function calHTML(){
  const base=new Date();base.setDate(1);base.setMonth(base.getMonth()+cmo);
  const wd=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<span>${x}</span>`).join('');let out='';
  for(let k=0;k<2;k++){
    const d=new Date(base.getFullYear(),base.getMonth()+k,1),y=d.getFullYear(),m=d.getMonth(),n=new Date(y,m+1,0).getDate();
    let cells='<i></i>'.repeat((d.getDay()+6)%7);
    for(let i=1;i<=n;i++){const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
      cells+=`<b class="${busy.some(r=>iso>=r.start_date&&iso<r.end_date)?'bz':iso<today()?'pa':''}">${i}</b>`}
    out+=`<div class="mo"><h4>${d.toLocaleString('ru-RU',{month:'long',year:'numeric'})}</h4><div class="wd">${wd}</div><div class="dg">${cells}</div></div>`;
  }return out;
}
const moveCal=n=>{cmo=Math.max(0,cmo+n);$('#cal').innerHTML=calHTML()};
function gal(id,m){
  off3d();const c=cars.find(x=>x.id===id),v=$('#gv');if(!v)return;
  document.querySelectorAll('.gt button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  if(m==='photo')v.innerHTML=`<img src="${esc(c.image)}" alt="">`;
  else if(m==='3d'){
    if(window.mount3D){
      try{stop3d=mount3D(v,c.model_3d)}catch(e){console.error(e);v.innerHTML='<div class="ld">Ошибка 3D: '+esc(e.message)+'</div>'}
    }else{
      v.innerHTML='<div class="ld">Загружаем 3D-просмотрщик…</div>';
      addEventListener('m3d',()=>gal(id,m),{once:true});
      setTimeout(()=>{if(!window.mount3D&&$('#gv'))$('#gv').innerHTML='<div class="ld">3D не загрузилось. Проверь интернет и обнови страницу.</div>'},9000);
    }
  }else v.innerHTML='<div class="ld">У этой машины пока нет фото и 3D-модели</div>';
}
async function showCar(id){
  off3d();setTab(1);scrollTo(0,0);$('#app').innerHTML='<div class="wrap"><div class="sk" style="margin-top:40px"></div></div>';
  try{
    const c=await api(`/cars/${id}/`),b=await api(`/cars/${id}/busy-dates/`).catch(()=>[]);
    busy=b.results||b;cmo=0;cars=cars.filter(x=>x.id!==c.id).concat(c);
    const mine=token&&String(c.owner)===uid(),t=today();
    const specs=[['Год',c.year+' г.'],c.transmission&&['Коробка',GB[c.transmission]||c.transmission],c.fuel&&['Топливо',FL[c.fuel]||c.fuel],c.seats&&['Мест',c.seats]].filter(Boolean).map(x=>`<div class="sc"><small>${x[0]}</small><b>${esc(x[1])}</b></div>`).join('');
    const tabs=c.model_3d&&c.image?`<div class="gt"><button data-m="3d" onclick="gal(${c.id},'3d')">3D-модель</button><button data-m="photo" onclick="gal(${c.id},'photo')">Фото</button></div>`:'';
    const book=mine?`<div class="cn"><button class="btn g" style="flex:1" onclick="carM(${c.id})">Изменить</button><button class="btn r" style="flex:1" onclick="delCar(${c.id})">Удалить</button></div><p class="mu" style="margin-top:10px">Это твоя машина. Брони и чаты смотри во вкладках «Мои брони» и «Чаты».</p>`
      :c.status==='available'?`<div class="two"><div><label>С какого дня</label><input id="d1" type="date" min="${t}" onchange="calc(${c.id})"></div><div><label>По какой день</label><input id="d2" type="date" min="${t}" onchange="calc(${c.id})"></div></div><div class="tot" id="tot">Выбери даты аренды</div><button class="btn f" onclick="book(${c.id})">Забронировать</button>`
      :'<div class="tot">Сейчас машина недоступна</div>';
    $('#app').innerHTML=`<div class="wrap"><button class="back" onclick="showCars()">← Все машины</button><div class="dtl"><div>
<div class="gal">${tabs}<div id="gv"></div></div>
${c.description?`<div class="box2"><h3>Об этой машине</h3><p style="white-space:pre-line;color:#c4c7d0">${esc(c.description)}</p></div>`:''}
<div class="box2"><h3>Когда машина свободна</h3><div class="cn" style="margin-bottom:12px"><button class="btn g s" onclick="moveCal(-1)">← Раньше</button><button class="btn g s" onclick="moveCal(1)">Позже →</button></div><div class="cals" id="cal">${calHTML()}</div><p class="mu" style="margin-top:12px">Зелёные дни свободны, красные заняты.</p></div>
</div><aside class="panel"><span class="badge ${esc(c.status)}">${ST[c.status]||esc(c.status)}</span><h1>${esc(c.brand)} ${esc(c.model)}</h1>
<div class="mu" style="margin-top:4px">${c.rating?'★ '+c.rating+' средняя оценка':'Пока без оценок'}</div>
<div class="pl2">${fmt(c.price_per_day)} <small>в сутки</small></div><div class="specs">${specs}</div>
${c.owner_username?`<div class="own"><i>${esc(c.owner_username[0].toUpperCase())}</i><div><b>${esc(c.owner_username)}</b><div class="mu">Владелец</div></div></div>`:''}
<div style="margin-top:14px">${book}</div></aside></div></div>`;
    gal(c.id,c.model_3d?'3d':c.image?'photo':'none');
  }catch(e){toast(err(e));showCars()}
}
function calc(id){
  const c=cars.find(x=>x.id===id),a=$('#d1').value,b=$('#d2').value;if(!a||!b)return;
  const n=Math.round((new Date(b)-new Date(a))/864e5);
  $('#tot').innerHTML=n<=0?'Дата окончания должна быть позже начала':busy.some(r=>a<r.end_date&&b>r.start_date)?'Эти даты уже заняты':`${n} сут. × ${fmt(c.price_per_day)}<b>${fmt(n*c.price_per_day)}</b>`;
}
async function book(id){
  if(!token){pend=id;toast('Войди, чтобы забронировать');return authM()}
  const a=$('#d1').value,b=$('#d2').value;if(!a||!b)return toast('Выбери даты аренды');

    $('#bx').innerHTML=`<div style="text-align:center"><h2>Машина забронирована</h2><p class="mu" style="margin-top:6px">Итого: ${fmt(d.total_price)}. Владелец получил уведомление.</p></div><button class="btn f" onclick="chatM(${d.id})">Написать владельцу</button><button class="btn g f" onclick="closeM();showBookings()">Мои брони</button>`;openM();
  }catch(e){toast(err(e))}
}

/* Мои машины */
async function showMine(){
  if(!need('Войди, чтобы управлять машинами'))return;
  off3d();setTab(2);scrollTo(0,0);
  $('#app').innerHTML='<div class="wrap" style="min-height:64vh"><div class="ph"><div><h2 class="ttl">Мои машины</h2><span class="mu">Добавляй, меняй и удаляй свои автомобили</span></div><button class="btn" onclick="carM()">+ Добавить машину</button></div><div class="grid" id="mg"></div></div>';
  try{const d=await api('/cars/');cars=d.results||d;const l=cars.filter(c=>String(c.owner)===uid());
    $('#mg').innerHTML=l.length?l.map(carCard).join(''):'<div class="empty">У тебя пока нет машин.<br><button class="btn" onclick="carM()">+ Добавить машину</button></div>';
  }catch(e){toast(err(e))}
}
function carM(id){
  if(!need('Войди, чтобы добавить машину'))return;
  const c=id?cars.find(x=>x.id===id):{};
  $('#bx').innerHTML=`<h2>${id?'Изменить машину':'Новая машина'}</h2><div class="two"><div><label>Марка</label><input id="f1" placeholder="Toyota" value="${esc(c.brand)}"></div><div><label>Модель</label><input id="f2" placeholder="Camry" value="${esc(c.model)}"></div></div>
<div class="two"><div><label>Год выпуска</label><input id="f3" type="number" min="1950" max="2100" value="${esc(c.year)}"></div><div><label>Цена за сутки</label><input id="f4" type="number" min="0" value="${c.price_per_day?Math.round(c.price_per_day):''}"></div></div>
<label>Статус</label><select id="f5"><option value="available">Свободна</option><option value="maintenance">На обслуживании</option></select>
<label>Описание</label><textarea id="f7" placeholder="Состояние, пробег, условия аренды">${esc(c.description)}</textarea>
<label>Фото</label><input id="f6" type="file" accept="image/*">
<label>3D-модель (файл .glb)</label><input id="f8" type="file" accept=".glb"><p class="mu" style="margin-top:6px">Где взять: <a href="https://sketchfab.com" target="_blank" rel="noopener">Sketchfab</a> или <a href="https://www.fab.com/" target="_blank" rel="noopener">Fab</a> (фильтр Downloadable, формат GLB).${c.model_3d?' Модель уже загружена, новый файл её заменит.':''}</p>
<button class="btn f" onclick="saveCar(${id||0})">${id?'Сохранить изменения':'Добавить машину'}</button>`;
  if(c.status)$('#f5').value=c.status;openM();
}
async function saveCar(id){
  const f=new FormData(),im=$('#f6').files[0],m3=$('#f8').files[0];
  [['brand','f1'],['model','f2'],['year','f3'],['price_per_day','f4'],['status','f5'],['description','f7']].forEach(([k,i])=>f.append(k,$('#'+i).value.trim()));
  if(im)f.append('image',im);if(m3){f.append('model_3d',m3);toast('Загружаем 3D-модель, это может занять время…')}
  try{await api(id?`/cars/${id}/`:'/cars/',{method:id?'PATCH':'POST',body:f});closeM();toast(id?'Изменения сохранены':'Машина добавлена');showMine()}catch(e){toast(err(e))}
}
async function delCar(id){if(!confirm('Удалить эту машину?'))return;try{await api(`/cars/${id}/`,{method:'DELETE'});toast('Машина удалена');showMine()}catch(e){toast(err(e))}}

/* Вход */
function authM(m){
  m=m||'in';
  $('#bx').innerHTML=`<div class="tabs"><button class="${m==='in'?'on':''}" onclick="authM('in')">Вход</button><button class="${m==='up'?'on':''}" onclick="authM('up')">Регистрация</button></div><input id="u" placeholder="Логин" autocomplete="username">${m==='up'?'<input id="e" type="email" placeholder="Email" style="margin-top:10px">':''}<input id="p" type="password" placeholder="Пароль, от 6 символов" style="margin-top:10px" onkeydown="if(event.key==='Enter')auth('${m}')"><button class="btn f" onclick="auth('${m}')">${m==='in'?'Войти':'Создать аккаунт'}</button>`;openM();
}
async function auth(m){
  const u=$('#u').value.trim(),p=$('#p').value;
  try{if(m==='up')await api('/register/',{method:'POST',body:{username:u,email:$('#e').value.trim(),password:p}});
    const d=await api('/login/',{method:'POST',body:{username:u,password:p}});
    token=d.access;localStorage.setItem('t',d.access);localStorage.setItem('r',d.refresh);localStorage.setItem('u',u);
    closeM();renderNav();toast(m==='up'?'Аккаунт создан. Добро пожаловать!':'Ты вошёл как '+u);
    if(pend){const id=pend;pend=null;showCar(id)}else showCars();
  }catch(e){toast(err(e))}
}

/* Брони и чаты */
async function showBookings(){
  if(!need('Войди, чтобы увидеть брони'))return;
  off3d();setTab(3);scrollTo(0,0);
  $('#app').innerHTML='<div class="wrap" style="min-height:64vh"><div class="ph"><div><h2 class="ttl">Мои брони</h2><span class="mu">Твои поездки и брони на твои машины</span></div></div><div id="bl"></div></div>';
  try{const d=await api('/dogovors/'),l=(d.results||d).sort((a,b)=>b.id-a.id);
    $('#bl').innerHTML=l.length?l.map(b=>{const mine=String(b.user)===uid();
      return `<div class="bk ${esc(b.status)}"><div class="g"><h3>${esc(b.car_title)}</h3><div class="mu">${esc(b.start_date)} — ${esc(b.end_date)}${mine?'':`<br>Клиент: ${esc(b.user_username)}`}</div></div><b>${fmt(b.total_price)}</b><span class="badge ${esc(b.status)}">${ST[b.status]||esc(b.status)}</span><div class="cn"><button class="btn d s" onclick="chatM(${b.id})">Чат</button>${['pending','confirmed'].includes(b.status)?`<button class="btn r s" onclick="cancelBook(${b.id})">Отменить</button>`:''}</div></div>`}).join('')
      :'<div class="empty">Броней пока нет.<br><button class="btn" onclick="showCars()">Найти машину</button></div>';
  }catch(e){toast(err(e))}
}
async function cancelBook(id){if(!confirm('Отменить бронь №'+id+'?'))return;try{await api(`/dogovors/${id}/cancel/`,{method:'POST'});toast('Бронь отменена');showBookings()}catch(e){toast(err(e))}}
async function showChats(){
  if(!need('Войди, чтобы открыть чаты'))return;
  off3d();setTab(4);scrollTo(0,0);
  $('#app').innerHTML='<div class="wrap" style="min-height:64vh"><div class="ph"><div><h2 class="ttl">Чаты</h2><span class="mu">Переписка по каждой брони</span></div></div><div id="cl"></div></div>';
  try{const d=await api('/dogovors/'),l=(d.results||d).sort((a,b)=>b.id-a.id);
    $('#cl').innerHTML=l.length?l.map(b=>`<div class="ci" onclick="chatM(${b.id})"><div><h3>${esc(b.car_title)}</h3><div class="mu">${esc(b.start_date)} — ${esc(b.end_date)}${String(b.user)===uid()?'':`<br>Клиент: ${esc(b.user_username)}`}</div></div><button class="btn s">Открыть чат</button></div>`).join(''):'<div class="empty">Чатов пока нет. Они появляются вместе с бронями.</div>';
  }catch(e){toast(err(e))}
}
function chatM(id){
  $('#bx').innerHTML=`<h2>Чат по брони №${id}</h2><div class="msgs" id="ms"></div><div class="send"><input id="mt" placeholder="Напиши сообщение" onkeydown="if(event.key==='Enter')sendMsg(${id})"><button class="btn" onclick="sendMsg(${id})">Отправить</button></div>`;
  openM();loadMsgs(id);clearInterval(ct);ct=setInterval(()=>loadMsgs(id),4000);
}
async function loadMsgs(id){
  try{const d=await api('/messages/?dogovor='+id),l=d.results||d,box=$('#ms');if(!box)return;
    const down=box.scrollTop+box.clientHeight>=box.scrollHeight-40;
    box.innerHTML=l.length?l.map(m=>`<div class="b ${String(m.sender)===uid()?'me':''}"><small>${esc(m.sender_username)}, ${new Date(m.created_at).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</small>${esc(m.text)}</div>`).join(''):'<div class="empty">Сообщений пока нет. Напиши первым.</div>';
    if(down)box.scrollTop=box.scrollHeight;
  }catch(e){}
}
async function sendMsg(id){
  const i=$('#mt'),t=i.value.trim();if(!t)return;
  try{await api('/messages/',{method:'POST',body:{dogovor:id,text:t}});i.value='';await loadMsgs(id);const b=$('#ms');b.scrollTop=b.scrollHeight}catch(e){toast(err(e))}
}
renderNav();showCars();
</script>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
import {KTX2Loader} from 'three/addons/loaders/KTX2Loader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
const VIEWS={side:[0,1.3,8],top:[.01,9,.01]};

window.mount3D=function(el,url,bare){
  const W=el.clientWidth||800,H=el.clientHeight||500;
  const r=new THREE.WebGLRenderer({antialias:true,alpha:true});
  r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(W,H,false);
  r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.05;
  r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;
  el.innerHTML='';el.appendChild(r.domElement);
  const sc=new THREE.Scene();
  sc.environment=new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(),.04).texture;
  const cam=new THREE.PerspectiveCamera(36,W/H,.1,60);cam.position.set(6.4,2.2,6.4);
  const ctl=new OrbitControls(cam,r.domElement);
  ctl.target.set(0,.75,0);ctl.enableDamping=true;ctl.enablePan=false;ctl.minDistance=4;ctl.maxDistance=12;ctl.maxPolarAngle=1.5;ctl.autoRotate=true;ctl.autoRotateSpeed=1.2;
  if(bare){ctl.enableZoom=false;r.domElement.style.touchAction='pan-y'}
  sc.add(new THREE.HemisphereLight(0xffffff,0x222633,.6));
  const sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(4,7,5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0005;
  Object.assign(sun.shadow.camera,{left:-5,right:5,top:5,bottom:-5});sc.add(sun);
  const rimL=new THREE.DirectionalLight(0xd8b56a,1.4);rimL.position.set(-6,3,-5);sc.add(rimL);
  const st=new THREE.Mesh(new THREE.CylinderGeometry(3.5,3.5,.08,72),new THREE.MeshStandardMaterial({color:0x14161c,roughness:.3,metalness:.75}));
  st.position.y=-.04;st.receiveShadow=true;sc.add(st);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(3.5,.02,8,96),new THREE.MeshBasicMaterial({color:0xd8b56a}));ring.rotation.x=Math.PI/2;ring.position.y=.001;sc.add(ring);

  const ld=document.createElement('div');ld.className='ld';ld.textContent='Загружаем 3D-модель…';el.appendChild(ld);
  const dl=new DRACOLoader();dl.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
  const kt=new KTX2Loader();kt.setTranscoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/basis/');kt.detectSupport(r);
  const gl=new GLTFLoader();gl.setDRACOLoader(dl);gl.setKTX2Loader(kt);gl.setMeshoptDecoder(MeshoptDecoder);

  async function getGLB(){
    const res=await fetch(url);
    if(!res.ok)throw new Error('сервер ответил '+res.status+' (файл не найден или недоступен)');
    const total=+res.headers.get('content-length')||0,rd=res.body.getReader(),parts=[];let got=0;
    for(;;){
      const x=await rd.read();if(x.done)break;
      parts.push(x.value);got+=x.value.length;
      ld.textContent='Загружаем 3D-модель… '+(total?Math.round(got/total*100)+'%':Math.round(got/1048576)+' МБ');
    }
    const buf=new Uint8Array(got);let off=0;for(const p of parts){buf.set(p,off);off+=p.length}
    if(String.fromCharCode(buf[0],buf[1],buf[2],buf[3])!=='glTF')throw new Error('это не .glb: в начале файла другое содержимое ('+Math.round(got/1024)+' КБ)');
    ld.textContent='Обрабатываем модель…';
    return new Promise((ok,bad)=>gl.parse(buf.buffer,'',ok,bad));
  }
  getGLB().then(g=>{
    const obj=g.scene;
    obj.traverse(x=>{if(x.isMesh){x.castShadow=true;x.receiveShadow=true;if(x.material&&x.material.envMapIntensity!=null)x.material.envMapIntensity=1.3}});
    const s0=new THREE.Box3().setFromObject(obj).getSize(new THREE.Vector3());
    if(s0.z>s0.x)obj.rotation.y=Math.PI/2;
    const s1=new THREE.Box3().setFromObject(obj).getSize(new THREE.Vector3());
    obj.scale.setScalar(4.6/Math.max(s1.x,s1.z));
    const b2=new THREE.Box3().setFromObject(obj),cc=b2.getCenter(new THREE.Vector3());
    obj.position.set(-cc.x,-b2.min.y,-cc.z);
    sc.add(obj);ld.remove();
  }).catch(e=>{console.error(e);ld.textContent='Не удалось открыть модель: '+((e&&e.message)||e)});

  let want=null,spin=true,tid,alive=true;
  if(!bare){
    el.insertAdjacentHTML('beforeend','<div class="vb"><div><button data-v="side">Сбоку</button><button data-v="top">Сверху</button><button data-r class="on">Вращение</button></div><button data-f>На весь экран</button></div>');
    el.onclick=e=>{
      const b=e.target.closest('button');if(!b)return;
      if(b.dataset.v){want=new THREE.Vector3(...VIEWS[b.dataset.v]);spin=false;ctl.autoRotate=false;el.querySelector('[data-r]').classList.remove('on')}
      if(b.dataset.r!=null){spin=!spin;ctl.autoRotate=spin;b.classList.toggle('on',spin)}
      if(b.dataset.f!=null&&el.requestFullscreen)el.requestFullscreen();
    };
  }
  ctl.addEventListener('start',()=>{ctl.autoRotate=false;want=null;clearTimeout(tid)});
  ctl.addEventListener('end',()=>{clearTimeout(tid);tid=setTimeout(()=>{ctl.autoRotate=spin},3500)});
  const ro=new ResizeObserver(()=>{const w=el.clientWidth,h=el.clientHeight;if(!w||!h)return;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()});ro.observe(el);
  (function tick(){
    if(!alive||!el.isConnected){ro.disconnect();ctl.dispose();r.dispose();return}
    requestAnimationFrame(tick);
    if(want){cam.position.lerp(want,.08);if(cam.position.distanceTo(want)<.05)want=null}
    ctl.update();r.render(sc,cam);
  })();
  return ()=>{alive=false};
};
window.dispatchEvent(new Event('m3d'));
</script>
